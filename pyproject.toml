[project]
name = "kroger-agent"
version = "0.1.0"
description = "Taste-aware Kroger ordering: local SQLite history, cadence engine, agent skill."
requires-python = ">=3.11"
dependencies = [
    "kroger-cart>=1.1.3",
    "requests>=2.32",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "python-dotenv>=1.0",
]

[project.scripts]
kroger = "kroger.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kroger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
